# CI gates for eshu-ingester (org gate contract; Refs eshu-hq/eshu-ingester#1).
#
# Thin caller over the shared lane bodies in
# eshu-hq/.github/.github/workflows/go-collector-ci.yml (v2, pinned below):
# this file holds the paths-filter `changes` job, the `go-ci` call with
# this repo's run-gate wiring, and the two caller-side jobs the reusable
# cannot own (weekly findings issue, Security-tab upload). Lane bodies
# (lint/test/race/shell/image/boundary/govulncheck/gosec/actionlint and
# the ci-complete aggregator) live upstream; check runs nest as
# `go-ci / <lane>`, so the ruleset requires `go-ci / ci-complete`.
#
# Pinned actions (Dependabot github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   actions/download-artifact v7         37930b1c2abaa49bbe596cd826c3c89aef350131
#   github/codeql-action/upload-sarif v3 4bfa242aa49c5f7c6770b98670d354a7dfac05f8
#   eshu-hq/.github v2                   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Go tools (org pins; the reusable carries the same defaults, and this
# caller overrides only gosec to this repo's measured zero-finding
# baseline, proven in #6):
#   golangci-lint v2.12.2, govulncheck v1.9.0, gosec v2.30.0,
#   actionlint 1.7.12.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Path selection runs once, on pull requests. Pushes, schedules, and
    # dispatches skip this job and the go-ci run-* inputs below select
    # every lane (fail closed), exactly as the in-repo lanes did.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflow: ${{ steps.filter.outputs.workflow }}
      shell: ${{ steps.filter.outputs.shell }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            docs:
              - '**/*.md'
              - 'LICENSE*'
            go:
              - '**/*.go'
            fixtures:
              # Files tests may read that are not Go sources. None exist in
              # tree today (no testdata/, JSON, YAML, manifest, or example
              # files), so this class is future-proofing wired to `test`.
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - 'manifest.yaml'
              - '*.example.*'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflow:
              - '.github/workflows/**'
            shell:
              - '**/*.sh'
            misc:
              # Fail closed per the epic: anything not classified above runs
              # lint+test+race. Docs stay negated so docs-only PRs keep
              # skipping every lane; every classified pattern is negated too
              # so narrow lanes (fixtures/shell) keep their shape.
              - '**'
              - '!**/*.md'
              - '!LICENSE*'
              - '!**/*.go'
              - '!testdata/**'
              - '!**/*.json'
              - '!**/*.yaml'
              - '!**/*.yml'
              - '!manifest.yaml'
              - '!*.example.*'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'
              - '!**/*.sh'

  go-ci:
    # always(): changes runs only on pull_request, so without this the
    # call (and every lane) is skipped on push, schedule, and dispatch.
    if: always()
    needs: [changes]
    # contents:read is the minimum that can fetch the reusable workflow
    # definition upstream; inner jobs run under the reusable's own
    # contents:read declaration. Top-level stays empty (fork-safe).
    permissions:
      contents: read
    # No timeout-minutes here: a reusable-call job accepts only name/uses/
    # with/secrets/needs/if/permissions, so the run ceiling lives in the
    # upstream inner-lane timeouts.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: ingester
      go-version-file: go.mod
      # Total statement coverage floor. May only rise. Measured 100.0% when
      # the floor landed (#11); the finish line is 90%.
      coverage-floor: 100.0
      run-image: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflow == 'true' }}
      image-tag: ci-ingester:ci
      image-context: .
      image-command: |
        set -euo pipefail
        from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
        from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
        echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
        [ "$from_pinned" -ge 1 ] && [ "$from_pinned" -eq "$from_total" ]
      run-lint: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true' }}
      run-test: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true' }}
      run-race: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true' }}
      run-shell: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.shell == 'true' }}
      # No boundary gate in this repo; the empty command keeps the lane
      # skipped while the name stays reserved upstream.
      run-boundary: false
      boundary-command: ''
      run-govulncheck: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.deps == 'true' }}
      run-gosec: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflow == 'true' }}
      # Findings fail scheduled runs so the failure()-gated issue job
      # below is reachable; PR runs stay advisory green.
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      # This repo's measured zero-finding baseline (see #6); the reusable
      # default is older.
      gosec-version: v2.30.0
      run-actionlint: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflow == 'true' }}

  scheduled-findings:
    # The reusable runs contents:read-only, so weekly issue filing stays a
    # caller job. Fires only when go-ci failed on a schedule event.
    needs: [go-ci]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: file or update the weekly findings issue
        run: |
          title="[ci] weekly scan findings $(date -u +%F)"
          body="Scheduled govulncheck/gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi

  gosec-sarif:
    # Security-tab upload the reusable deliberately omits (fork PRs run
    # read-only): caller-side, non-PR events only. Skips when go-ci
    # failed: the finding count stays in that run's summary and the
    # weekly issue links the run.
    needs: [go-ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with security-events:write.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download SARIF report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -n "gosec-ingester" --dir .
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: gosec.sarif
