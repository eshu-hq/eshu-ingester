# CI gates for eshu-ingester (org gate contract; Refs eshu-hq/eshu-ingester#1).
#
# Frozen job names: changes, lint, test, race, shell, image, govulncheck,
# govulncheck-report, gosec, gosec-sarif, ci-complete. ci-complete is the
# ONLY context the main ruleset requires: it fails if a needed lane failed
# and passes when lanes were legitimately skipped (docs-only PRs). A later
# move of lane bodies to eshu-hq/.github reusable workflows keeps these
# names, so branch protection never churns.
#
# Skeleton state (2026-10-28): the tree holds only README.md. Every Go,
# fixture, shell, and image lane carries a tree guard (go.mod /
# Dockerfile / **/*.sh presence) so it passes vacuous until that code
# lands, then activates with no workflow edit. The .golangci.yml org
# config, the measured COVERAGE_FLOOR baseline, and the lint-backlog zero
# land with the first Go code (child issues of #1).
#
# Path selection happens once, in `changes` (dorny/paths-filter). A PR only
# pays for lanes its paths can affect:
#   docs only (*.md, LICENSE) .... no lanes, ci-complete succeeds
#   Go sources (**/*.go) .......... lint, test, race (+ coverage artifact)
#   fixtures (testdata/**, **/*.json|yaml|yml, manifest.yaml,
#     *.example.*) ................ test only (files tests read; none exist
#                                  today, so this class is future-proofing)
#   go.mod/go.sum/.golangci.yml .... lint, test, race, govulncheck
#   Dockerfile/.dockerignore ....... image (build only, no push)
#   .github/workflows/** .......... actionlint, plus lint, test, race
#   shell (**/*.sh, none today) .... shell only
#   anything else (Makefile, .github/dependabot.yml, future files):
#     the `misc` catch-all runs lint, test, race (fail closed per the epic).
# Pushes, schedules, and dispatches skip `changes` and run every lane: each
# lane treats a non-successful changes result as "run" (fail closed), and
# each tree guard narrows that to "run only if the inputs exist", so no
# event can go green with zero lanes on real changes. Scheduled
# govulncheck findings open or update an issue via the govulncheck-report
# job, which is the only job holding issues:write. Likewise gosec-sarif is
# the only job holding security-events:write; both scan jobs stay at
# contents:read.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_VERSION: 2.12.2
  GOVULNCHECK_VERSION: 1.9.0
  GOSEC_VERSION: 2.30.0
  ACTIONLINT_VERSION: 1.7.12
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  # Baseline measured with the first Go code (#10, 2026-10-28): 100.0% of
  # statements (-covermode=atomic) over internal/intake. The floor may only
  # rise; never lower it to move the number. The finish line is 90%: already
  # met, so no test-writing follow-up was filed.
  COVERAGE_FLOOR: "100.0"

jobs:
  changes:
    # Path selection runs once, on pull requests. Pushes, schedules, and
    # dispatches skip this job and run every lane: each lane treats a
    # non-successful changes result as "run" (fail closed).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflow: ${{ steps.filter.outputs.workflow }}
      shell: ${{ steps.filter.outputs.shell }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            docs:
              - '**/*.md'
              - 'LICENSE*'
            go:
              - '**/*.go'
            fixtures:
              # Files tests may read that are not Go sources. None exist in
              # tree today (no testdata/, JSON, YAML, manifest, or example
              # files), so this class is future-proofing wired to `test`.
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - 'manifest.yaml'
              - '*.example.*'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflow:
              - '.github/workflows/**'
            shell:
              - '**/*.sh'
            misc:
              # Fail closed per the epic: anything not classified above runs
              # lint+test+race. Docs stay negated so docs-only PRs keep
              # skipping every lane; every classified pattern is negated too
              # so narrow lanes (fixtures/shell) keep their shape.
              - '**'
              - '!**/*.md'
              - '!LICENSE*'
              - '!**/*.go'
              - '!testdata/**'
              - '!**/*.json'
              - '!**/*.yaml'
              - '!**/*.yml'
              - '!manifest.yaml'
              - '!*.example.*'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'
              - '!**/*.sh'

  lint:
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tree guard (no go.mod yet)
        id: goguard
        run: |
          set -euo pipefail
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No go.mod yet (skeleton): Go steps skip, workflow lint still runs."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.goguard.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - name: Vet
        if: steps.goguard.outputs.present == 'true'
        run: go vet ./...
      - name: golangci-lint
        if: steps.goguard.outputs.present == 'true'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.GOLANGCI_VERSION }} run ./...
      - name: Format check (gofumpt)
        if: steps.goguard.outputs.present == 'true'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.GOLANGCI_VERSION }} fmt --diff ./...
      - name: Module tidiness
        if: steps.goguard.outputs.present == 'true'
        run: go mod tidy -diff
      - name: 500-line file cap
        if: steps.goguard.outputs.present == 'true'
        run: |
          set -euo pipefail
          over=$(git ls-files '*.go' | while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 500 ]; then printf '%s (%s lines)\n' "$f" "$n"; fi
          done)
          if [ -n "$over" ]; then
            echo "Files over the 500-line cap:"
            echo "$over"
            exit 1
          fi
          echo "500-line cap: OK ($(git ls-files '*.go' | wc -l) files checked)"
      - name: Install actionlint
        if: github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true'
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/rhysd/actionlint/cmd/actionlint@v${{ env.ACTIONLINT_VERSION }}
      - name: actionlint
        if: github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true'
        run: actionlint

  test:
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tree guard (no go.mod yet)
        id: goguard
        run: |
          set -euo pipefail
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No go.mod yet (skeleton): lane passes vacuous."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.goguard.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - name: Build
        if: steps.goguard.outputs.present == 'true'
        run: go build ./...
      - name: Test
        if: steps.goguard.outputs.present == 'true'
        run: go test ./... -count=1

  race:
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.misc == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tree guard (no go.mod yet)
        id: goguard
        run: |
          set -euo pipefail
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No go.mod yet (skeleton): lane passes vacuous."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.goguard.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - name: Race tests with coverage
        if: steps.goguard.outputs.present == 'true'
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - name: Upload coverage artifact
        if: steps.goguard.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14
          if-no-files-found: error
      - name: Coverage totals and floor
        if: steps.goguard.outputs.present == 'true'
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out > cover.func
          total=$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' cover.func)
          echo "total=${total}% floor=${{ env.COVERAGE_FLOOR }}%"
          {
            echo "## Coverage"
            echo ""
            echo "Total ${total}% (floor ${{ env.COVERAGE_FLOOR }}%). Per-package statement coverage:"
            echo ""
            echo "| Package | Covered | Statements | Coverage |"
            echo "| --- | --- | --- | --- |"
            awk 'NR > 1 {n=split($1, a, ":"); file=a[1]; pkg=file; sub(/\/[^/]*$/, "", pkg); stmts[pkg]+=$2; if ($3 > 0) cov[pkg]+=$2} END {for (p in stmts) printf "| %s | %d | %d | %.1f%% |\n", p, cov[p]+0, stmts[p], 100*(cov[p]+0)/stmts[p]}' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v total="$total" -v floor="${{ env.COVERAGE_FLOOR }}" 'BEGIN {exit !(total + 0 >= floor + 0)}'

  shell:
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.shell == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(**/*.sh)
          if ((${#files[@]} == 0)); then
            echo "No shell scripts in tree; lane passes vacuous."
            exit 0
          fi
          curl -fsSL -o /tmp/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          shellcheck_bin="/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$shellcheck_bin" "${files[@]}"

  image:
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tree guard (no Dockerfile yet)
        id: dockguard
        run: |
          set -euo pipefail
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No Dockerfile yet (skeleton): lane passes vacuous."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build image (no push)
        if: steps.dockguard.outputs.present == 'true'
        run: docker build -t ci-ingester:ci .
      - name: Base images are digest-pinned
        if: steps.dockguard.outputs.present == 'true'
        run: |
          set -euo pipefail
          from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
          from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
          echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
          [ "$from_pinned" -ge 1 ] && [ "$from_pinned" -eq "$from_total" ]

  govulncheck:
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR scans run with a read-only token: issue filing lives in
    # govulncheck-report, which carries issues:write and runs on schedule
    # only when this scan failed. workflow_dispatch also runs the report
    # job (download only) for pre-merge proof.
    permissions:
      contents: read
    outputs:
      scan-outcome: ${{ steps.scan.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tree guard (no go.mod yet)
        id: goguard
        run: |
          set -euo pipefail
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No go.mod yet (skeleton): lane passes vacuous."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.goguard.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - name: Scan
        id: scan
        if: steps.goguard.outputs.present == 'true'
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/vuln/cmd/govulncheck@v${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./... | tee govulncheck.txt
      - name: Upload scan report (schedule and dispatch only)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.goguard.outputs.present == 'true' && hashFiles('govulncheck.txt') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-${{ github.sha }}
          path: govulncheck.txt
          retention-days: 14

  govulncheck-report:
    needs: [govulncheck]
    if: always() && ((github.event_name == 'schedule' && needs.govulncheck.outputs.scan-outcome == 'failure') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with issues:write.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download scan report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -n "govulncheck-${{ github.sha }}" --dir .
      - name: File or update tracking issue (schedule only)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="govulncheck findings ($(date -u +%F))"
          if [ -f govulncheck.txt ]; then
            findings=$(cat govulncheck.txt)
          else
            findings="(govulncheck report unavailable — the scan step produced no output file)"
          fi
          body="Weekly govulncheck run $GITHUB_RUN_ID reported findings. See the run log for the full report."
          body="$body Findings: $findings"
          number=$(gh issue list --search "$title in:title" --state open --json number --query '.[0].number')
          if [ -n "$number" ] && [ "$number" != "null" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec:
    needs: [changes]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs run this scan with a read-only token: SARIF upload lives in
    # gosec-sarif, which carries security-events:write and runs on
    # push/schedule/dispatch when this scan produced a report.
    permissions:
      contents: read
    outputs:
      has-sarif: ${{ steps.sarif.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tree guard (no go.mod yet)
        id: goguard
        run: |
          set -euo pipefail
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No go.mod yet (skeleton): lane passes vacuous."; echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.goguard.outputs.present == 'true'
        with:
          go-version-file: go.mod
      - name: Scan (advisory)
        id: scan
        if: steps.goguard.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/securego/gosec/v2/cmd/gosec@v${{ env.GOSEC_VERSION }}
          gosec -fmt sarif -out gosec.sarif ./...
      - name: Report findings
        if: always() && steps.goguard.outputs.present == 'true'
        run: |
          set -euo pipefail
          if [ ! -f gosec.sarif ]; then
            echo "gosec.sarif missing (scan step produced no output) — advisory lane stays green" >> "$GITHUB_STEP_SUMMARY"
            echo "gosec.sarif missing (scan step produced no output) — advisory lane stays green"
            exit 0
          fi
          count=$(python3 -c "import json; print(sum(len(r.get('results', [])) for r in json.load(open('gosec.sarif'))['runs']))")
          echo "gosec findings: $count (advisory — triaged in the Security tab, never blanket-excluded)" >> "$GITHUB_STEP_SUMMARY"
          echo "gosec findings: $count (advisory)"
      - name: Check SARIF output
        id: sarif
        if: always()
        run: |
          set -euo pipefail
          if [ -f gosec.sarif ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Upload SARIF artifact (push/schedule/dispatch only)
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.goguard.outputs.present == 'true' && hashFiles('gosec.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gosec-${{ github.sha }}
          path: gosec.sarif
          retention-days: 14

  gosec-sarif:
    needs: [gosec]
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.gosec.outputs.has-sarif == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with security-events:write.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download SARIF report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" -n "gosec-${{ github.sha }}" --dir .
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif

  ci-complete:
    if: always()
    needs: [changes, lint, test, race, shell, image, govulncheck, govulncheck-report, gosec, gosec-sarif]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Gate
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -qE '"result": "(failure|cancelled)"'; then
            echo "ci-complete: a needed lane failed or was cancelled"
            exit 1
          fi
          echo "ci-complete: all needed lanes passed (skips are legitimate)"
